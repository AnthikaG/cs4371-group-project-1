
input {
  kafka {
    bootstrap_servers => "kafka:29092"
    topics => ["topic2"]
    group_id => "cs4371-logstash"
    auto_offset_reset => "earliest"
    codec => "json"
  }
}

filter {
  if ![entity] or ![entity_type] or ![run_id] or ![count] {
    drop {}
  }

  mutate {
    convert => {
      "count" => "integer"
    }
  }

  if [window_end] {
    date {
      match => ["window_end", "ISO8601"]
      target => "@timestamp"
    }
  }

  # Unique document ID for each entity within a Spark run
  fingerprint {
    source => ["run_id", "entity_type", "entity"]
    method => "SHA256"
    concatenate_sources => true
    target => "[@metadata][document_id]"
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "named-entities-latest"
    document_id => "%{[@metadata][document_id]}"
    action => "update"
    doc_as_upsert => true
  }

  stdout {
    codec => rubydebug
  }
}
