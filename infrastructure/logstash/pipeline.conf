
input {
  kafka {
    bootstrap_servers => "kafka:29092"
    topics => ["topic2"]
    group_id => "cs4371-logstash"
    auto_offset_reset => "earliest"
    codec => "json"
  }
}

filter {
  # Ignore messages without required fields
  if ![entity] or ![count] {
    drop {}
  }

  # Convert entity count to integer
  mutate {
    convert => {
      "count" => "integer"
    }
  }

  # Use the timestamp from the Spark entity stream
  if [window_end] {
    date {
      match => ["window_end", "ISO8601"]
      target => "@timestamp"
    }
  }
}

output {
  # Store entity counts in Elasticsearch
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "named-entities"
  }

  # Print processed messages for debugging
  stdout {
    codec => rubydebug
  }
}
